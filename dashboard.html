<script>
const API_URL = "https://interview-project-uimv.onrender.com";

const navItems = document.querySelectorAll(".nav-item[data-page]");
const pages = document.querySelectorAll(".page");

function getLoggedInUser() {
    try {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user || !user.email) {
            return null;
        }

        return user;
    } catch (error) {
        console.error("User data error:", error);
        return null;
    }
}

function getUserEmail() {
    const user = getLoggedInUser();

    if (!user) {
        return null;
    }

    return user.email;
}

function showPage(pageId) {

    pages.forEach(page => {
        page.classList.remove("active-page");
    });

    const selected = document.getElementById(pageId);

    if (selected) {
        selected.classList.add("active-page");

        if (pageId === "dashboard") {
            refreshDashboard();
        }

        if (pageId === "history") {
            loadInterviewHistory();
        }
    }

    navItems.forEach(item => {

        item.classList.remove("active");

        if (item.dataset.page === pageId) {
            item.classList.add("active");
        }

    });

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    const sidebar = document.getElementById("sidebar");

    if (sidebar) {
        sidebar.classList.remove("open");
    }
}

navItems.forEach(item => {

    item.addEventListener("click", function() {
        showPage(this.dataset.page);
    });

});

const mobileMenu = document.getElementById("mobileMenu");

if (mobileMenu) {

    mobileMenu.addEventListener("click", function() {

        const sidebar = document.getElementById("sidebar");

        if (sidebar) {
            sidebar.classList.toggle("open");
        }

    });

}

const collapseSidebar = document.getElementById("collapseSidebar");

if (collapseSidebar) {

    collapseSidebar.addEventListener("click", function() {

        const sidebar = document.getElementById("sidebar");
        const main = document.querySelector(".main");

        if (!sidebar || !main) {
            return;
        }

        if (sidebar.style.width === "80px") {

            sidebar.style.width = "280px";
            main.style.marginLeft = "280px";

        } else {

            sidebar.style.width = "80px";
            main.style.marginLeft = "80px";

        }

    });

}

const logoutButton = document.getElementById("logout");

if (logoutButton) {

    logoutButton.addEventListener("click", function() {

        if (confirm("Are you sure you want to log out?")) {

            localStorage.clear();
            sessionStorage.clear();

            window.location.href = "login.html";

        }

    });

}

function normalizeInterviews(interviews) {

    if (!Array.isArray(interviews)) {
        return [];
    }

    return interviews
        .filter(interview => interview)
        .sort((a, b) => {

            const dateA =
                new Date(a.createdAt || 0).getTime();

            const dateB =
                new Date(b.createdAt || 0).getTime();

            return dateB - dateA;

        });

}

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function getInterviewType(interview) {

    return interview.type ||
        interview.title ||
        "HR Interview";

}

function getInterviewScore(interview) {

    const score =
        Number(interview.score);

    if (Number.isNaN(score)) {
        return 0;
    }

    return Math.round(score);

}

function formatInterviewDate(dateValue) {

    if (!dateValue) {
        return "-";
    }

    const date =
        new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return "-";
    }

    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}

function getRelativeTime(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    const now =
        new Date();

    const difference =
        now.getTime() - date.getTime();

    const minutes =
        Math.floor(
            difference / 60000
        );

    if (minutes < 1) {
        return "Just now";
    }

    if (minutes < 60) {
        return `${minutes}m ago`;
    }

    const hours =
        Math.floor(minutes / 60);

    if (hours < 24) {
        return `${hours}h ago`;
    }

    const days =
        Math.floor(hours / 24);

    if (days < 7) {
        return `${days}d ago`;
    }

    return formatInterviewDate(dateValue);

}

async function fetchUserInterviews() {

    const email =
        getUserEmail();

    if (!email) {

        console.warn(
            "No logged-in user found."
        );

        return [];

    }

    const url =
        `${API_URL}/api/interviews?email=${encodeURIComponent(email)}&t=${Date.now()}`;

    const response =
        await fetch(url, {
            method: "GET",
            cache: "no-store"
        });

    if (!response.ok) {

        const errorText =
            await response.text();

        console.error(
            "Interview API error:",
            errorText
        );

        throw new Error(
            "Failed to load interviews"
        );

    }

    const interviews =
        await response.json();

    return normalizeInterviews(interviews);

}

async function loadDashboardAnalytics() {

    const totalElement =
        document.getElementById(
            "dashboardTotalInterviews"
        );

    const averageElement =
        document.getElementById(
            "dashboardAverageScore"
        );

    const bestElement =
        document.getElementById(
            "dashboardBestScore"
        );

    const improvementElement =
        document.getElementById(
            "dashboardImprovement"
        );

    if (!totalElement ||
        !averageElement ||
        !bestElement ||
        !improvementElement) {

        return;

    }

    totalElement.textContent = "--";
    averageElement.textContent = "--";
    bestElement.textContent = "--";
    improvementElement.textContent = "--";

    const email =
        getUserEmail();

    if (!email) {

        console.warn(
            "No logged-in user email."
        );

        return;

    }

    try {

        const response =
            await fetch(
                `${API_URL}/api/analytics?email=${encodeURIComponent(email)}&t=${Date.now()}`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Analytics request failed"
            );

        }

        const data =
            await response.json();

        totalElement.textContent =
            data.totalInterviews ?? 0;

        averageElement.textContent =
            data.averageScore ?? 0;

        bestElement.textContent =
            data.bestScore ?? 0;

        improvementElement.textContent =
            "--";

    } catch (error) {

        console.error(
            "Dashboard Analytics Error:",
            error
        );

        totalElement.textContent = "--";
        averageElement.textContent = "--";
        bestElement.textContent = "--";
        improvementElement.textContent = "--";

    }

}

function updateRecentActivity(interviews) {

    const activityContainer =
        document.querySelector(
            ".dashboard-lower .card:first-child"
        );

    if (!activityContainer) {
        return;
    }

    const title =
        activityContainer.querySelector(
            ".panel-title"
        );

    if (!title) {
        return;
    }

    activityContainer.innerHTML = "";

    activityContainer.appendChild(title);

    if (!interviews.length) {

        const emptyItem =
            document.createElement("div");

        emptyItem.className =
            "activity-item";

        emptyItem.innerHTML = `
            <div class="activity-icon">◷</div>
            <div class="activity-info">
                <strong>No interviews yet</strong>
                <small>Complete your first HR interview to see activity here.</small>
            </div>
        `;

        activityContainer.appendChild(
            emptyItem
        );

        return;

    }

    const latest =
        interviews[0];

    const activityItem =
        document.createElement("div");

    activityItem.className =
        "activity-item";

    const score =
        getInterviewScore(latest);

    const type =
        escapeHTML(
            getInterviewType(latest)
        );

    const relativeTime =
        getRelativeTime(
            latest.createdAt
        );

    activityItem.innerHTML = `
        <div class="activity-icon">♟</div>

        <div class="activity-info">
            <strong>${type}</strong>
            <small>Score: ${score}/100</small>
        </div>

        <span class="time">
            ${escapeHTML(relativeTime)}
        </span>
    `;

    activityContainer.appendChild(
        activityItem
    );

}

function updateProgressChart(interviews) {

    const chart =
        document.querySelector(
            ".chart-panel .chart"
        );

    const labelsContainer =
        document.querySelector(
            ".chart-panel .chart-labels"
        );

    const improving =
        document.querySelector(
            ".chart-panel .improving"
        );

    if (!chart || !labelsContainer) {
        return;
    }

    const oldArea =
        chart.querySelector(".chart-area");

    const oldLine =
        chart.querySelector(".chart-line");

    if (!interviews.length) {

        if (oldArea) {
            oldArea.setAttribute(
                "d",
                "M0,170 L500,170 L500,190 L0,190 Z"
            );
        }

        if (oldLine) {
            oldLine.setAttribute(
                "d",
                "M0,170 L500,170"
            );
        }

        labelsContainer.innerHTML = `
            <span>No data</span>
        `;

        if (improving) {

            improving.innerHTML = `
                <strong>📊 No interview data yet</strong>
                <p>Complete an interview to start tracking your progress.</p>
            `;

        }

        return;

    }

    const recent =
        interviews
            .slice(0, 10)
            .reverse();

    const scores =
        recent.map(
            interview =>
                getInterviewScore(interview)
        );

    const width = 500;
    const height = 190;
    const padding = 15;

    const usableWidth =
        width - padding * 2;

    const usableHeight =
        height - 45;

    const points =
        scores.map((score, index) => {

            const x =
                scores.length === 1
                    ? width / 2
                    : padding +
                      (
                          index /
                          (scores.length - 1)
                      ) *
                      usableWidth;

            const y =
                padding +
                (
                    100 - score
                ) /
                100 *
                usableHeight;

            return {
                x,
                y
            };

        });

    const linePath =
        points
            .map(
                (point, index) =>
                    `${index === 0 ? "M" : "L"}${point.x},${point.y}`
            )
            .join(" ");

    const firstPoint =
        points[0];

    const lastPoint =
        points[points.length - 1];

    const areaPath =
        `${linePath} L${lastPoint.x},${height} L${firstPoint.x},${height} Z`;

    if (oldLine) {

        oldLine.setAttribute(
            "d",
            linePath
        );

    }

    if (oldArea) {

        oldArea.setAttribute(
            "d",
            areaPath
        );

    }

    const firstScore =
        scores[0];

    const lastScore =
        scores[scores.length - 1];

    const difference =
        lastScore - firstScore;

    if (scores.length === 1) {

        labelsContainer.innerHTML = `
            <span>${escapeHTML(
                formatInterviewDate(
                    recent[0].createdAt
                )
            )}</span>
        `;

    } else {

        const firstDate =
            formatInterviewDate(
                recent[0].createdAt
            );

        const lastDate =
            formatInterviewDate(
                recent[recent.length - 1].createdAt
            );

        labelsContainer.innerHTML = `
            <span>${escapeHTML(firstDate)}</span>
            <span>${escapeHTML(lastDate)}</span>
        `;

    }

    if (improving) {

        if (difference > 0) {

            improving.innerHTML = `
                <strong>🚀 Upward trajectory!</strong>
                <p>Your latest score is ${difference} points higher than your first recorded score.</p>
            `;

        } else if (difference < 0) {

            improving.innerHTML = `
                <strong>📈 Keep practicing!</strong>
                <p>Your latest score is ${Math.abs(difference)} points below your first recorded score.</p>
            `;

        } else {

            improving.innerHTML = `
                <strong>🎯 Keep going!</strong>
                <p>Your performance is currently stable. Continue practicing to improve.</p>
            `;

        }

    }

}

function formatImprovement(interviews) {

    if (!interviews ||
        interviews.length < 2) {

        return "--";

    }

    const latest =
        getInterviewScore(
            interviews[0]
        );

    const oldest =
        getInterviewScore(
            interviews[interviews.length - 1]
        );

    if (oldest === 0) {
        return "--";
    }

    const improvement =
        Math.round(
            (
                (
                    latest - oldest
                ) /
                oldest
            ) *
            100
        );

    if (improvement > 0) {
        return `+${improvement}%`;
    }

    if (improvement < 0) {
        return `${improvement}%`;
    }

    return "0%";

}

function updateImprovement(interviews) {

    const element =
        document.getElementById(
            "dashboardImprovement"
        );

    if (!element) {
        return;
    }

    element.textContent =
        formatImprovement(interviews);

}

async function loadInterviewHistory() {

    const historyTableBody =
        document.querySelector(
            "#historyTable tbody"
        );

    if (!historyTableBody) {
        return;
    }

    historyTableBody.innerHTML = `
        <tr>
            <td colspan="5" style="text-align:center;color:#94a3b8;">
                Loading interview history...
            </td>
        </tr>
    `;

    try {

        const interviews =
            await fetchUserInterviews();

        historyTableBody.innerHTML = "";

        if (!interviews.length) {

            historyTableBody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align:center;color:#94a3b8;">
                        No interviews completed yet.
                    </td>
                </tr>
            `;

            return;

        }

        interviews.forEach(
            interview => {

                const row =
                    document.createElement("tr");

                const date =
                    formatInterviewDate(
                        interview.createdAt
                    );

                const type =
                    escapeHTML(
                        getInterviewType(
                            interview
                        )
                    );

                const score =
                    getInterviewScore(
                        interview
                    );

                row.innerHTML = `
                    <td>
                        <strong>${type}</strong>
                    </td>

                    <td>
                        ${type}
                    </td>

                    <td>
                        <span style="font-weight:600;color:#818cf8;">
                            ${score}/100
                        </span>
                    </td>

                    <td>
                        ${escapeHTML(date)}
                    </td>

                    <td>
                        <span style="color:#34d399;font-weight:600;">
                            ● Completed
                        </span>
                    </td>
                `;

                historyTableBody.appendChild(
                    row
                );

            }
        );

    } catch (error) {

        console.error(
            "Interview History Error:",
            error
        );

        historyTableBody.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center;color:#f87171;">
                    Unable to load interview history.
                </td>
            </tr>
        `;

    }

}

async function refreshDashboard() {

    try {

        const interviews =
            await fetchUserInterviews();

        updateRecentActivity(
            interviews
        );

        updateProgressChart(
            interviews
        );

        updateImprovement(
            interviews
        );

    } catch (error) {

        console.error(
            "Dashboard refresh error:",
            error
        );

        updateRecentActivity([]);

        updateProgressChart([]);

        updateImprovement([]);

    }

    await loadDashboardAnalytics();

}

const saveSettingsBtn =
    document.getElementById(
        "saveSettingsBtn"
    );

const settingTargetRole =
    document.getElementById(
        "settingTargetRole"
    );

const settingPreferredSkill =
    document.getElementById(
        "settingPreferredSkill"
    );

function loadSettings() {

    const savedRole =
        localStorage.getItem(
            "targetRole"
        );

    const savedSkill =
        localStorage.getItem(
            "preferredSkill"
        );

    if (
        savedRole &&
        settingTargetRole
    ) {

        settingTargetRole.value =
            savedRole;

    }

    if (
        savedSkill &&
        settingPreferredSkill
    ) {

        settingPreferredSkill.value =
            savedSkill;

    }

}

if (saveSettingsBtn) {

    saveSettingsBtn.addEventListener(
        "click",
        () => {

            if (settingTargetRole) {

                localStorage.setItem(
                    "targetRole",
                    settingTargetRole.value
                );

            }

            if (settingPreferredSkill) {

                localStorage.setItem(
                    "preferredSkill",
                    settingPreferredSkill.value
                );

            }

            alert(
                "Preferences saved successfully!"
            );

        }
    );

}

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            showPage("dashboard");

        }

    }
);

async function handleNotify(
    event,
    moduleName
) {

    event.preventDefault();

    const form =
        event.target;

    const input =
        form.querySelector(
            "input[type='email']"
        );

    if (!input) {
        return;
    }

    const email =
        input.value.trim();

    if (!email) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API_URL}/api/early-access`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        module: moduleName
                    })
                }
            );

        if (response.ok) {

            alert(
                `You're on the early-access list for ${moduleName}!`
            );

            form.reset();

        } else {

            alert(
                "Unable to submit your request right now."
            );

        }

    } catch (error) {

        console.error(
            "Early access error:",
            error
        );

        alert(
            "Unable to connect to the server."
        );

    }

}

const currentUser =
    getLoggedInUser();

if (!currentUser) {

    console.warn(
        "No logged-in user. Redirecting to login."
    );

    window.location.href =
        "login.html";

} else {

    refreshDashboard();
    loadSettings();

}
</script>
