<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HR Interview | InterviewIQ AI</title>
    <link rel="icon" type="image/png" href="./Robot.png?v=3">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: #ffffff;
            min-height: 100vh;
        }

        .content {
            padding: 35px 70px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 22px;
            font-weight: bold;
        }

        .brand-name span {
            color: #6366f1;
        }
    
        .back {
            color: #8b98ad;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .back:hover {
            color: #ffffff;
        }


        h1 {
            margin-top: 30px;
            font-size: 30px;
            color: #ffffff;
        }

        .subtitle {
            color: #8b98ad;
            margin-top: 8px;
            font-size: 16px;
        }
        .interview-card {
            margin-top: 30px;
            background: #0b1220;
            border: 1px solid #17243a;
            border-radius: 15px;
            padding: 30px;
            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.45);
        }

        .progress-container {
            width: 100%;
            height: 9px;
            background: #172238;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .progress {
            height: 100%;
            width: 10%;
            background: #6366f1;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 15px;
            margin-bottom: 10px;
            color: #8b98ad;
        }

        .question {
            font-size: 24px;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.4;
        }
      
        .instruction {
            color: #8b98ad;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            height: 175px;
            background: #070d19;
            color: #ffffff;
            border: 1px solid #24324a;
            border-radius: 10px;
            padding: 18px;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea::placeholder {
            color: #64748b;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow:
                0 0 0 2px rgba(99, 102, 241, 0.15);
        }
        .bottom {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-size: 18px;
            color: #cbd5e1;
        }

        .next-button {
            border: none;
            background: #6366f1;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .next-button:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        @media(max-width: 800px) {

            .content {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }

            .interview-card {
                padding: 20px;
            }

            .question {
                font-size: 21px;
            }

            .bottom {
                flex-direction: column;
                gap: 18px;
                align-items: stretch;
            }

            .timer {
                text-align: center;
            }

            .next-button {
                width: 100%;
            }
        }

        @media(max-width: 500px) {

            .content {
                padding: 20px;
            }

            .interview-card {
                padding: 18px;
            }

            textarea {
                height: 150px;
            }

            .question {
                font-size: 20px;
            }
        }

    </style>

</head>

<body>

    <div class="content">
        <div class="brand">
            <img src="./Robot.png" alt="InterviewIQ AI Logo">

            <div class="brand-name">
                Interview<span>IQ AI</span>
            </div>
        </div>

        <a href="dashboard.html" class="back">
            ← Back to Dashboard
        </a>

        <h1>
            HR Interview
        </h1>

        <p class="subtitle">
            Practice real HR questions with your AI interviewer.
        </p>

        <div class="interview-card">

            <div class="progress-container">

                <div
                    class="progress"
                    id="progress">
                </div>

            </div>

            <div class="question-number">

                Question
                <span id="questionNumber">
                    1
                </span>
                of 10

            </div>

            <h2
                class="question"
                id="question">

                Tell me about yourself.

            </h2>

            <p
                class="instruction"
                id="instruction">

                Introduce yourself and highlight your key strengths,
                skills and achievements.

            </p>

            <textarea
                id="answer"
                placeholder="Type your answer here... Press Enter for the next question."
            ></textarea>

            <div class="bottom">

                <div
                    class="timer"
                    id="timer">

                    ⏱ 03:00

                </div>

                <button
                    class="next-button"
                    onclick="nextQuestion()">

                    Next Question →

                </button>

            </div>

        </div>

    </div>

<script>

const API_URL =
    "https://interview-project-uimv.onrender.com";


const questions = [

    {
        question: "Tell me about yourself.",
        instruction:
            "Introduce yourself and highlight your key strengths, skills and achievements."
    },

    {
        question: "What are your strengths?",
        instruction:
            "Tell us about your main strengths and how they help you."
    },

    {
        question: "What are your weaknesses?",
        instruction:
            "Describe one area you are working to improve."
    },

    {
        question: "Why should we hire you?",
        instruction:
            "Explain why you would be a good fit for this role."
    },

    {
        question: "Where do you see yourself in five years?",
        instruction:
            "Describe your career goals and future plans."
    },

    {
        question: "Why do you want to join our company?",
        instruction:
            "Explain why you are interested in this company."
    },

    {
        question: "Tell me about a challenge you faced.",
        instruction:
            "Describe a challenge you faced and how you handled it."
    },

    {
        question: "How do you handle pressure?",
        instruction:
            "Explain how you manage stressful situations."
    },

    {
        question: "What are your career goals?",
        instruction:
            "Tell us about your short-term and long-term career goals."
    },

    {
        question: "Do you have any questions for us?",
        instruction:
            "Ask any relevant questions you have about the company or role."
    }

];
let currentQuestion = 0;

let timeLeft = 180;

let timerInterval;

let answers = [];

function updatePage() {

    document.getElementById(
        "questionNumber"
    ).textContent =
        currentQuestion + 1;

    document.getElementById(
        "question"
    ).textContent =
        questions[currentQuestion].question;

    document.getElementById(
        "instruction"
    ).textContent =
        questions[currentQuestion].instruction;

    document.getElementById(
        "answer"
    ).value = "";

    document.getElementById(
        "progress"
    ).style.width =
        ((currentQuestion + 1) * 10) + "%";

    timeLeft = 180;

    updateTimer();

    startTimer();

}

function startTimer() {

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            nextQuestion();

        }

    }, 1000);

}
function updateTimer() {

    let minutes =
        Math.floor(timeLeft / 60);

    let seconds =
        timeLeft % 60;

    minutes =
        String(minutes).padStart(2, "0");

    seconds =
        String(seconds).padStart(2, "0");

    document.getElementById(
        "timer"
    ).textContent =
        "⏱ " + minutes + ":" + seconds;

}
async function nextQuestion() {

    const answer =
        document.getElementById(
            "answer"
        ).value.trim();

    if (answer === "") {

        alert(
            "Please enter your answer before continuing."
        );

        return;

    }

    answers.push({

        question:
            questions[currentQuestion].question,

        answer:
            answer

    });

    currentQuestion++;

    if (
        currentQuestion >=
        questions.length
    ) {

        clearInterval(timerInterval);

        await saveInterview();

        alert(
            "Interview completed! 🎉"
        );

        window.location.href =
            "feedback.html";

        return;

    }

    updatePage();

}
function evaluateInterview() {

    let totalScore = 0;

    answers.forEach(item => {

        const answer =
            item.answer.toLowerCase();

        let score = 0;

        if (answer.length >= 50) {

            score += 30;

        }

        else if (answer.length >= 25) {

            score += 20;

        }

        else {

            score += 10;

        }

        const keywords = [

            "team",
            "skill",
            "experience",
            "project",
            "learn",
            "communication",
            "problem",
            "goal",
            "improve",
            "challenge"

        ];
        keywords.forEach(keyword => {

            if (
                answer.includes(keyword)
            ) {

                score += 7;

            }

        });
        score =
            Math.min(score, 100);


        totalScore += score;

    });

    const averageScore =
        Math.round(
            totalScore /
            answers.length
        );


    return {

        score:
            averageScore,

        communication:
            Math.min(
                averageScore + 3,
                100
            ),

        technical:
            Math.max(
                averageScore - 5,
                0
            ),

        problemSolving:
            Math.min(
                averageScore + 1,
                100
            ),

        confidence:
            Math.min(
                averageScore + 2,
                100
            )

    };

}

async function saveInterview() {

    try {

        const evaluation =
            evaluateInterview();

        const response =
            await fetch(

                `${API_URL}/api/interviews`,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            userName:
                                "Guest",

                            type:
                                "HR",

                            score:
                                evaluation.score,

                            communication:
                                evaluation.communication,

                            technical:
                                evaluation.technical,

                            problemSolving:
                                evaluation.problemSolving,

                            confidence:
                                evaluation.confidence,

                            feedback:
                                "Your interview has been evaluated based on your answer quality, relevance and communication.",

                            answers:
                                answers

                        })

                }

            );

        if (!response.ok) {

            console.log(
                "Interview data could not be saved."
            );

        } else {

            console.log(
                "Interview saved successfully."
            );

        }

    }

    catch (error) {

        console.log(
            "Backend connection error:",
            error
        );

    }

}

document.getElementById(
    "answer"
).addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            nextQuestion();

        }

    }

);

updatePage();

</script>

</body>
</html>
