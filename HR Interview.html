<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HR Interview | InterviewIQ AI</title>
    <link rel="icon" type="image/png" href="./Robot.png?v=2">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7fb;
            color: #172554;
        }

        .main {
            margin-left: 290px;
            min-height: 100vh;
        }

        .content {
            padding: 35px 70px;
        }

        .back {
            color: #64748b;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            margin-top: 30px;
            font-size: 30px;
        }

        .subtitle {
            color: #64748b;
            margin-top: 8px;
            font-size: 16px;
        }

        .interview-card {
            margin-top: 30px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .progress-container {
            width: 100%;
            height: 9px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .progress {
            height: 100%;
            width: 10%;
            background: #6046e8;
            transition: width 0.3s;
        }

        .question-number {
            font-size: 15px;
            margin-bottom: 10px;
            color: #334155;
        }

        .question {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .instruction {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 175px;
            border: 1px solid #d9dce5;
            border-radius: 10px;
            padding: 18px;
            font-size: 15px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #6046e8;
        }

        .bottom {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            font-size: 18px;
            color: #334155;
        }

        .next-button {
            border: none;
            background: #6046e8;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .next-button:hover {
            background: #4d36c9;
        }

        @media(max-width: 800px) {

            .sidebar {
                width: 220px;
            }

            .main {
                margin-left: 220px;
            }

            .content {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="content">

        <a href="dashboard.html" class="back">
            ← Back to Dashboard
        </a>

        <h1>HR Interview</h1>

        <p class="subtitle">
            Practice real HR questions with your AI interviewer.
        </p>

        <div class="interview-card">

            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>

            <div class="question-number">
                Question <span id="questionNumber">1</span> of 10
            </div>

            <h2 class="question" id="question">
                Tell me about yourself.
            </h2>

            <p class="instruction" id="instruction">
                Introduce yourself and highlight your key strengths,
                skills and achievements.
            </p>

            <textarea
                id="answer"
                placeholder="Type your answer here..."
            ></textarea>

            <div class="bottom">

                <div class="timer" id="timer">
                    ⏱ 03:00
                </div>

                <button
                    class="next-button"
                    onclick="nextQuestion()"
                >
                    Next Question →
                </button>

            </div>

        </div>

    </div>

<script>

const API_URL = "https://interview-project-uimv.onrender.com";

const questions = [

    {
        question: "Tell me about yourself.",
        instruction: "Introduce yourself and highlight your key strengths, skills and achievements."
    },

    {
        question: "What are your strengths?",
        instruction: "Tell us about your main strengths and how they help you."
    },

    {
        question: "What are your weaknesses?",
        instruction: "Describe one area you are working to improve."
    },

    {
        question: "Why should we hire you?",
        instruction: "Explain why you would be a good fit for this role."
    },

    {
        question: "Where do you see yourself in five years?",
        instruction: "Describe your career goals and future plans."
    },

    {
        question: "Why do you want to join our company?",
        instruction: "Explain why you are interested in this company."
    },

    {
        question: "Tell me about a challenge you faced.",
        instruction: "Describe a challenge you faced and how you handled it."
    },

    {
        question: "How do you handle pressure?",
        instruction: "Explain how you manage stressful situations."
    },

    {
        question: "What are your career goals?",
        instruction: "Tell us about your short-term and long-term career goals."
    },

    {
        question: "Do you have any questions for us?",
        instruction: "Ask any relevant questions you have about the company or role."
    }

];

let currentQuestion = 0;
let timeLeft = 180;
let timerInterval;
let answers = [];


function updatePage() {

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("question").textContent =
        questions[currentQuestion].question;

    document.getElementById("instruction").textContent =
        questions[currentQuestion].instruction;

    document.getElementById("answer").value = "";

    document.getElementById("progress").style.width =
        ((currentQuestion + 1) * 10) + "%";

    timeLeft = 180;

    updateTimer();

    startTimer();

    document.getElementById("answer").focus();
}


function startTimer() {

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            nextQuestion();
        }

    }, 1000);
}


function updateTimer() {

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    minutes = String(minutes).padStart(2, "0");
    seconds = String(seconds).padStart(2, "0");

    document.getElementById("timer").textContent =
        "⏱ " + minutes + ":" + seconds;
}


async function nextQuestion() {

    const answer =
        document.getElementById("answer").value.trim();

    if (answer === "") {

        alert("Please enter your answer before continuing.");

        return;
    }

    answers.push({

        question: questions[currentQuestion].question,

        answer: answer

    });

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        clearInterval(timerInterval);

        await saveInterview();

        alert("Interview completed! 🎉");

        window.location.href = "feedback.html";

        return;
    }

    updatePage();
}


/* ENTER KEY → NEXT QUESTION */
document.getElementById("answer").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            nextQuestion();
        }

    }
);


function evaluateInterview() {

    let totalScore = 0;

    answers.forEach(item => {

        const answer = item.answer.toLowerCase();

        let score = 0;

        if (answer.length >= 50) {
            score += 30;
        } else if (answer.length >= 25) {
            score += 20;
        } else {
            score += 10;
        }

        const keywords = [
            "team",
            "skill",
            "experience",
            "project",
            "learn",
            "communication",
            "problem",
            "goal",
            "improve",
            "challenge"
        ];

        keywords.forEach(keyword => {

            if (answer.includes(keyword)) {
                score += 7;
            }

        });

        score = Math.min(score, 100);

        totalScore += score;

    });

    const averageScore =
        Math.round(totalScore / answers.length);

    return {
        score: averageScore,
        communication: Math.min(averageScore + 3, 100),
        technical: Math.max(averageScore - 5, 0),
        problemSolving: Math.min(averageScore + 1, 100),
        confidence: Math.min(averageScore + 2, 100)
    };
}


async function saveInterview() {

    try {

        const evaluation = evaluateInterview();

        const response = await fetch(
            `${API_URL}/api/interviews`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    userName: "Guest",

                    type: "HR",

                    score: evaluation.score,

                    communication: evaluation.communication,

                    technical: evaluation.technical,

                    problemSolving: evaluation.problemSolving,

                    confidence: evaluation.confidence,

                    feedback:
                        "Your interview has been evaluated based on answer quality, relevance and communication.",

                    answers: answers

                })
            }
        );

        if (!response.ok) {

            console.log("Interview data could not be saved.");

        } else {

            console.log("Interview saved successfully.");

        }

    } catch (error) {

        console.log(
            "Backend connection error:",
            error
        );

    }
}


/* START FIRST QUESTION */
updatePage();

</script>

</body>
</html>
