<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - InterviewIQ AI</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="Robot.png">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .register-container {
            width: 400px;
            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .logo {
            margin-bottom: 15px;
        }

        .logo img {
            width: 85px;
            height: 85px;

            object-fit: contain;

            border-radius: 50%;
        }

        h1 {
            color: #172554;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
            font-size: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus {
            outline: none;

            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message {
            margin-top: 18px;

            font-weight: bold;

            min-height: 20px;
        }

        .login-link {
            margin-top: 22px;

            color: #666;

            font-size: 15px;
        }

        .login-link a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .brand {
            margin-top: 20px;

            font-size: 13px;

            color: #999;
        }

    </style>

</head>

<body>

    <div class="register-container">

        <!-- CENTER IMAGE -->
        <div class="logo">
            <img src="Robot.png" alt="InterviewIQ AI">
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join InterviewIQ AI and start practicing smarter.
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerButton"
            >
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login here
            </a>

        </div>


        <div class="brand">
            InterviewIQ AI • Practice Smarter. Interview Better.
        </div>

    </div>


    <script>

        document
        .getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");

            const button =
                document.getElementById("registerButton");


            message.textContent = "";

            button.disabled = true;

            button.textContent = "Creating Account...";


            try {

                const response = await fetch(
                    "https://interview-project-uimv.onrender.com/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    message.textContent =
                        "Registration successful!";

                    message.style.color = "green";


                    setTimeout(function() {

                        window.location.href =
                            "login.html";

                    }, 1000);

                }

                else {

                    message.textContent =
                        data.message ||
                        "Registration failed.";

                    message.style.color = "red";

                }

            }

            catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                message.textContent =
                    "Unable to connect to server.";

                message.style.color = "red";

            }


            button.disabled = false;

            button.textContent = "Create Account";

        });

    </script>

</body>
</html>
