<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - InterviewIQ AI</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="Robot.png">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .login-container {
            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .logo {
            margin-bottom: 15px;
        }

        .logo img {
            width: 85px;
            height: 85px;

            object-fit: contain;

            border-radius: 50%;
        }

        h1 {
            color: #172554;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;

            margin-bottom: 28px;

            font-size: 15px;
        }

        .form-group {
            text-align: left;

            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            background: #999;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        #message {
            margin-top: 18px;

            font-weight: bold;

            min-height: 20px;
        }

        .register-link {
            margin-top: 22px;

            color: #666;

            font-size: 15px;
        }

        .register-link a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .brand {
            margin-top: 20px;

            font-size: 13px;

            color: #999;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <!-- CENTER IMAGE -->
        <div class="logo">
            <img src="Robot.png" alt="InterviewIQ AI">
        </div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Login to InterviewIQ AI
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            href="dashboard.html">
                Login
            </button>

        </form>


        <p id="message"></p>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register here
            </a>

        </div>


        <div class="brand">
            InterviewIQ AI • Practice Smarter. Interview Better.
        </div>

    </div>


    <script>

        document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");

            const button =
                document.getElementById("loginButton");


            message.textContent = "";

            button.disabled = true;

            button.textContent = "Logging in...";


            try {

                const response = await fetch(
                    "https://interview-project-uimv.onrender.com/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    message.textContent =
                        "Login successful!";

                    message.style.color = "green";


                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );


                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 800);

                }

                else {

                    message.textContent =
                        data.message ||
                        "Invalid email or password";

                    message.style.color = "red";

                }

            }

            catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                message.textContent =
                    "Unable to connect to server.";

                message.style.color = "red";

            }


            button.disabled = false;

            button.textContent = "Login";

        });

    </script>

</body>
</html>
