<html>
<head>
    <title>LOGIN</title>
    <link rel="icon" type="image/png" href="./Robot.png?v=2">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap JavaScript -->
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Hide browser's extra password eye -->
    <style>
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
</head>

<body style="background: linear-gradient(135deg, #9e5ee2, #6eb1de, #c97171); min-height: 100vh;">

    <div class="container d-flex justify-content-center align-items-center"
         style="min-height: 100vh;">

        <div class="card shadow p-4" style="width: 450px;">

            <!-- Logo and Title -->
            <div class="text-center mb-4">

                <i class="bi bi-robot fs-1 text-primary"></i>

                <h2 class="fw-bold mt-2">
                    InterviewIQ <span class="text-primary">AI</span>
                </h2>

                <p class="text-muted">
                    Your AI-Powered Interview Coach
                </p>

            </div>

            <!-- Sign In Heading -->
            <h4 class="text-center text-primary fw-bold mb-4">
                Sign in to continue
            </h4>

            <!-- Email -->
            <div class="mb-3">

                <label class="form-label fw-bold">
                    Email Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email address">

                </div>

            </div>

            <!-- Password -->
            <div class="mb-3">

                <label class="form-label fw-bold">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="Enter your password">

                    <button type="button"
                            class="input-group-text"
                            onclick="togglePassword()">

                        <i class="bi bi-eye" id="eyeIcon"></i>

                    </button>

                </div>

            </div>

            <!-- Forgot Password -->
            <div class="text-end mb-3">

                <a href="#" class="text-primary text-decoration-none">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
            <div class="d-grid mt-4">

                <button type="button" class="btn btn-primary py-2">
                    Login
                </button>

            </div>

        </div>

    </div>

    <!-- Password Show/Hide -->
    <script>

        function togglePassword() {

            const password = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {

                password.type = "text";

                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");

            } else {

                password.type = "password";

                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");

            }

        }

    </script>

</body>
</html>
